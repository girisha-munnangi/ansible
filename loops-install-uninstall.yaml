- name: install uninstall packages
  hosts: local
  connection: local
  tasks:
  - name: install packages
    ansible.builtin.package:
      name: "{{ item.name }}"
      state: "{{ item.name }}"
    loop:
    - { name: "mysql" , state: "absent" }
    - { name: "nginx" , state: "present"}
    - { name: "zip" , state: "present" }