- name: printing vars prefference
  hosts: local
  connection: local
  vars:
  - name : printing playlevel vars
    NAME: vars from play level variables
  var_files:
  - vars.yaml
  var_prompt:
  - name: printing vars from prompt
    prompt: print the vars from prompt
    private: false
  tasks:
  - name : printing the vars from task level variables
    vars:
     NAME: vars from task level
    ansible.builtin.debug:
     msg: " print the vars {{ NAME }}"
    